name: Build and Deploy Frontend to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup Node.js và Build Frontend trên GitHub Runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
        # Kết quả sẽ sinh ra thư mục build/ hoặc dist/ hoặc public/

      # 2. Xóa các file source thừa, chỉ giữ lại file đã Build + Dockerfile + docker-compose
      # (Giúp gói deploy cực nhẹ, Beanstalk không cần chạy npm build lại)
      - name: Prepare Deployment Artifacts
        run: |
          mkdir deploy-package
          # Copy thư mục build tĩnh vừa tạo
          cp -r build deploy-package/
          # Copy Dockerfile mới và docker-compose.yml
          cp Dockerfile deploy-package/
          cp docker-compose.yml deploy-package/
          
          cd deploy-package
          zip -r ../deploy.zip .

      # BƯỚC DEBUG: In ra OIDC Token claim
      - name: Debug OIDC Token Claims
        run: |
          echo "Requesting OIDC token..."
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Decoding JWT Payload:"
          echo $TOKEN | jq -R 'split(".") | .[1] | @base64d | fromjson'
      
      # 3. Authenticate với AWS bằng OIDC / Assume Role
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842168250803:role/GitHubActions-Beanstalk-Role
          aws-region: ap-southeast-1

      # 4. Deploy gói nhẹ lên Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          # Lấy Credentials tạm thời từ bước OIDC trước đó:
          aws_access_key: ${{ env.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ env.AWS_SESSION_TOKEN }} # BẮT BUỘC có dòng này khi dùng OIDC / Assume Role
          
          application_name: "frontend"
          environment_name: "Frontend-env"
          version_label: "build-${{ github.sha }}"
          region: "ap-southeast-1"
          deployment_package: "deploy.zip"